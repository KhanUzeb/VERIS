name: veris-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q --cov=veris --cov-report=term-missing

  run-veris:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # Restores veris_trends.db between runs so the regression
      # baseline persists across PRs instead of resetting every time.
      - name: Restore trend store
        uses: actions/cache@v4
        with:
          path: |
            veris_trends.db
            veris_trends_cache.db
          key: veris-trends-${{ github.ref }}
          restore-keys: |
            veris-trends-
            veris-trends-refs/heads/main-
            eval-trends-

      - name: Skip live gate without API key
        id: gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "No GROQ_API_KEY secret — skipping live Veris gate."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate golden dataset
        if: steps.gate.outputs.run == 'true'
        run: python -m veris.cli validate

      - name: Run Veris gate
        if: steps.gate.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          python -m veris.cli run --target veris.targets:my_agent_fn --csv-out veris_report.csv

      - name: Upload report artifact
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: veris-report
          path: |
            veris_report.json
            veris_report.html
            veris_report.csv
