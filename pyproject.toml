[project]
name = "veris"
version = "2.1.1"
description = "Agent-agnostic local LLM evaluation and regression testing gate with DeepEval, golden datasets, SQLite baselines, and CI-ready exit codes."
requires-python = ">=3.11"
readme = "README.md"
keywords = [
    "llm-evaluation",
    "agent-evaluation",
    "llm-regression-testing",
    "regression-testing",
    "golden-dataset",
    "deepeval",
    "llm-as-judge",
    "llmops",
    "evals",
    "prompt-testing",
    "rag-evaluation",
    "sqlite",
    "llm",
    "agents",
    "ci",
    "testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "deepeval>=2.0.0,<5",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "groq>=0.9.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.urls]
Homepage = "https://github.com/KhanUzeb/VERIS"
Repository = "https://github.com/KhanUzeb/VERIS"
Documentation = "https://github.com/KhanUzeb/VERIS/blob/main/README.md"
Issues = "https://github.com/KhanUzeb/VERIS/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
veris = "veris.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["veris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
