[project]
name = "veris"
version = "2.1.0"
description = "Agent-agnostic local LLM evaluation and regression testing gate with DeepEval, golden datasets, SQLite baselines, and CI-ready exit codes."
requires-python = ">=3.11"
readme = "README.md"
keywords = ["llm-evaluation", "agent-evaluation", "regression-testing", "golden-dataset", "deepeval", "sqlite", "llm", "agents"]
dependencies = [
    "deepeval>=2.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "groq>=0.9.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
veris = "veris.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["veris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
