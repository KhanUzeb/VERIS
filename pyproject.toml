[project]
name = "veris"
version = "2.1.0"
description = "Veris — local regression gate for LLM/agent systems (DeepEval + RAGAS + Langfuse)."
requires-python = ">=3.11"
readme = "README.md"
keywords = ["llm", "eval", "regression", "deepeval", "ragas", "agents"]
dependencies = [
    "deepeval>=2.0.0",
    "ragas>=0.2.0",
    "datasets>=2.19.0",
    "langfuse>=2.36.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "groq>=0.9.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "langchain-community>=0.3.0,<0.4",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
veris = "veris.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["veris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
