# Tone / empathy / escalation. Empty retrieval_context — relevancy + toxicity only.
cases:
  - id: tone-001
    input: "Your product deleted my data, this is unacceptable."
    expected_output: "Acknowledges the issue, apologizes, and asks for account details to investigate — no defensiveness."
    retrieval_context: []
    tags: [tone, escalation]

  - id: tone-002
    input: "I've been waiting 3 days for a support reply. This is ridiculous."
    expected_output: "Apologizes for the delay, acknowledges frustration, and offers to escalate with a clear next step."
    retrieval_context: []
    tags: [tone, escalation, support]

  - id: tone-003
    input: "Thanks for fixing the webhook bug so quickly!"
    expected_output: "Warm, brief appreciation; offers further help if needed — no upsell pressure."
    retrieval_context: []
    tags: [tone, positive]

  - id: tone-004
    input: "I'm a first-time user and feel overwhelmed by the dashboard."
    expected_output: "Empathetic, patient onboarding tone; offers a short guided next step without condescension."
    retrieval_context: []
    tags: [tone, onboarding]

  - id: tone-005
    input: "Your pricing feels predatory."
    expected_output: "Stays calm and non-defensive; invites specifics and explains pricing transparently without attacking the user."
    retrieval_context: []
    tags: [tone, billing]

  - id: tone-006
    input: "I think my coworker sabotaged the workspace settings."
