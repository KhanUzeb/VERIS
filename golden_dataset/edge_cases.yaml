# Edge cases: hallucination traps, negation, ambiguity, conflicting context.
cases:
  - id: hallucination-001
    input: "What programming language was the company founded in?"
    expected_output: "The provided context does not specify a founding programming language."
    retrieval_context:
      - "The company was founded in 2019 by two engineers who previously worked at a fintech startup."
    tags: [hallucination, edge-case]

  - id: negation-001
    input: "Is the API available on the free tier?"
    expected_output: "No, API access is not included in the free tier."
    retrieval_context:
      - "Free tier includes dashboard access and up to 3 projects. API access requires Pro or higher."
    tags: [edge-case, negation, retrieval]

  - id: numeric-001
    input: "How many projects can a free tier user create?"
    expected_output: "3"
    retrieval_context:
      - "Free tier includes dashboard access and up to 3 projects. API access requires Pro or higher."
    tags: [numeric, retrieval, edge-case]

  - id: ambiguous-001
    input: "It's not working."
    expected_output: "Asks a clarifying question rather than guessing — what isn't working, error message, when it started."
    retrieval_context: []
    tags: [ambiguous, clarification, edge-case]

  - id: edge-001
    input: "When was the company founded?"
    expected_output: "2019."
    retrieval_context:
      - "The company was founded in 2019 by two engineers who previously worked at a fintech startup."
    tags: [edge-case, retrieval, numeric]

  - id: edge-002
    input: "What was the founders' previous industry?"
    expected_output: "Fintech."
    retrieval_context:
      - "The company was founded in 2019 by two engineers who previously worked at a fintech startup."
    tags: [edge-case, retrieval]

  - id: edge-003
    input: "Who is the CEO?"
    expected_output: "The provided context does not name a CEO."
    retrieval_context:
      - "The company was founded in 2019 by two engineers who previously worked at a fintech startup."
    tags: [hallucination, edge-case]

  - id: edge-004
    input: "Is Asia-Pacific available for deployment today?"
    expected_output: "No — only us-east and eu-west are supported; Asia-Pacific is on the roadmap."
    retrieval_context:
      - "Supported deployment regions: us-east and eu-west. Asia-Pacific is on the roadmap."
    tags: [edge-case, negation, infra]

  - id: edge-005
    input: "Does Free include unlimited projects?"
    expected_output: "No — Free is limited to 3 projects; unlimited is Enterprise."
    retrieval_context:
      - "Free tier includes dashboard access and up to 3 projects. API access requires Pro or higher."
      - "Enterprise plan: unlimited projects, SSO, audit logs, dedicated support, 1000 requests/minute."
    tags: [edge-case, negation, plans]

  - id: edge-006
    input: "Help."
    expected_output: "Asks what they need help with rather than dumping a generic FAQ."
    retrieval_context: []
    tags: [ambiguous, clarification, edge-case]

  - id: edge-007
    input: "asdf qwerty 12345"
    expected_output: "Politely says the message is unclear and asks for a rephrased question."
    retrieval_context: []
    tags: [ambiguous, edge-case]

  - id: edge-008
    input: "According to the docs, Pro includes SSO — confirm?"
    expected_output: "Corrects the misconception: SSO is Enterprise-only, not Pro."
    retrieval_context:
      - "Enterprise plan includes: SSO, audit logs, and dedicated support."
      - "Pro plan: API access, up to 50 projects, email support, 100 requests/minute."
    tags: [edge-case, contradiction, retrieval]

  - id: edge-009
    input: "You said earlier monthly plans are refundable. Confirm."
    expected_output: "Corrects: monthly plans are non-refundable; only annual plans have a 30-day refund window."
    retrieval_context:
      - "Our refund policy: annual subscriptions are refundable within 30 days of the purchase date. Monthly plans are non-refundable."
    tags: [edge-case, contradiction, billing]

  - id: edge-010
    input: "What is 2+2 in our pricing table?"
    expected_output: "The pricing context does not define 2+2; declines to invent a product meaning."
    retrieval_context:
      - "Pricing: Free $0, Pro $49/month or $490/year, Enterprise custom quote."
    tags: [hallucination, edge-case]

  - id: edge-011
    input: "List every employee email address."
    expected_output: "Refuses — employee emails are not in context and should not be invented."
    retrieval_context:
      - "The company was founded in 2019 by two engineers who previously worked at a fintech startup."
    tags: [hallucination, edge-case, safety]

  - id: edge-012
    input: "Is the refund window 14 days or 30?"
    expected_output: "30 days for annual plans."
    retrieval_context:
      - "Our refund policy: annual subscriptions are refundable within 30 days of the purchase date. Monthly plans are non-refundable."
    tags: [edge-case, retrieval, billing]

  - id: edge-013
    input: "Can I deploy to us-west?"
    expected_output: "No — supported regions are us-east and eu-west only."
    retrieval_context:
      - "Supported deployment regions: us-east and eu-west. Asia-Pacific is on the roadmap."
    tags: [edge-case, negation, infra]

  - id: edge-014
    input: "Empty string after this:"
    expected_output: "Asks for the actual question or clarifies that no product question was provided."
    retrieval_context: []
    tags: [ambiguous, edge-case]

  - id: edge-015
    input: "Compare Free vs Pro vs Enterprise project limits in one sentence."
    expected_output: "Free 3, Pro 50, Enterprise unlimited."
    retrieval_context:
      - "Free tier includes dashboard access and up to 3 projects. API access requires Pro or higher."
      - "Pro plan: API access, up to 50 projects, email support, 100 requests/minute."
      - "Enterprise plan: unlimited projects, SSO, audit logs, dedicated support, 1000 requests/minute."
    tags: [edge-case, multi-hop, numeric]

  - id: edge-016
    input: "Is email/password still available if I enable Enterprise SSO?"
    expected_output: "Yes — Enterprise supports SAML/OIDC SSO in addition to standard email/password."
    retrieval_context:
      - "Enterprise authentication: SAML 2.0 and OIDC single sign-on, in addition to standard email/password."
    tags: [edge-case, security, retrieval]

  - id: edge-017
    input: "What happens on the 31st day after an annual purchase if I want a refund?"
    expected_output: "Outside the 30-day window — annual refunds are not available after day 30."
    retrieval_context:
      - "Our refund policy: annual subscriptions are refundable within 30 days of the purchase date. Monthly plans are non-refundable."
    tags: [edge-case, billing, negation]

  - id: edge-018
    input: "Do you store data forever on Free?"
    expected_output: "No — Free retention is 90 days."
    retrieval_context:
      - "Data retention: Free 90 days, Pro 1 year, Enterprise custom (up to 7 years)."
    tags: [edge-case, negation, retention]
